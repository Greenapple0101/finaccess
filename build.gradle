// [이 파일이 하는 일] Gradle에게 '무엇을 준비해서 어떻게 만들지' 알려주는 설정입니다.
// Gradle은 필요한 라이브러리를 받아 Java 코드를 실행 가능한 형태로 만들고 테스트도 실행합니다.
// ./gradlew test: 테스트 / ./gradlew bootRun: 앱 시작 / ./gradlew bootJar: 실행 JAR 만들기.
// JAR은 앱 실행에 필요한 코드를 묶은 파일입니다. 이 파일 자체는 Java가 아니라 Groovy 문법을 씁니다.

// plugins는 Gradle에 Java 빌드·Spring Boot 앱 만들기 같은 기능을 추가합니다.
plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

// 앱의 소속과 버전 이름입니다. Java의 package 주소를 바꾸는 설정은 아닙니다.
group = 'io.github.greenapple0101'
version = '0.0.1-SNAPSHOT'

// 빌드할 때 사용할 Java 버전을 21로 정합니다.
java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

// 다른 사람이 만든 라이브러리를 어디에서 받을지 정합니다.
repositories {
	mavenCentral()
}

// dependencies는 이 프로젝트가 사용하는 라이브러리 목록입니다.
// implementation: 앱을 만들고 실행할 때 필요 / runtimeOnly: 실행할 때 필요.
// testImplementation·testRuntimeOnly는 테스트에서만 사용합니다.
// starter는 자주 함께 쓰는 라이브러리 묶음입니다. 업무 기능 자체를 만들어 주지는 않습니다.
// 이름 앞의 작은따옴표는 글자값이라는 표시이고 :로 공급자·이름을 구분합니다.
// 여기서 버전을 적지 않은 라이브러리는 Spring Boot의 버전 관리 설정을 따릅니다.
dependencies {
	// 웹 요청을 Java 메서드로 연결하고 JSON 응답을 보내는 기능입니다.
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Bearer 토큰의 서명·발급자·만료 시간 검사와 URL별 권한 검사를 준비합니다.
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
	// Java 객체를 DB 데이터와 연결하고 저장·조회하는 기능입니다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// V1, V2 같은 SQL 파일을 순서대로 한 번씩 적용하고 기록합니다.
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	// Java 앱이 PostgreSQL과 대화하는 데 필요한 연결 프로그램(드라이버)입니다.
	runtimeOnly 'org.postgresql:postgresql'
	// Flyway가 PostgreSQL을 다룰 수 있게 하는 추가 기능입니다.
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	// HTTP 응답을 자동으로 검사하는 MockMvc 등의 테스트 도구입니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.security:spring-security-test'
	// JUnit 테스트를 찾아 실행할 때 필요한 도구입니다.
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 테스트 시작·종료에 맞춰 컨테이너도 준비하고 정리합니다.
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	// 개발 DB와 별개로 테스트용 PostgreSQL을 실행합니다.
	testImplementation 'org.testcontainers:testcontainers-postgresql'
}

// test 작업에서 JUnit 방식의 테스트를 실행하도록 정합니다.
tasks.named('test') {
	useJUnitPlatform()
}
