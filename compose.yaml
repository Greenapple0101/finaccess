# [이 파일이 하는 일] 개발용 PostgreSQL을 Docker로 실행하는 방법을 정합니다.
# 이미지(image)는 실행에 필요한 파일 묶음, 컨테이너(container)는 그 묶음으로 만든 실행 환경입니다.
# docker compose up -d --wait: 뒤에서 실행하고 DB가 연결받을 준비가 될 때까지 기다립니다.
# docker compose stop: 잠시 멈춥니다. down -v는 저장 데이터까지 지우므로 같은 명령이 아닙니다.
# YAML은 들여쓰기로 어느 설정에 속하는지 구분합니다. 아래 공백도 의미가 있습니다.

# 이 설정으로 만든 컨테이너와 저장 공간을 묶어 부를 프로젝트 이름입니다.
name: finaccess

services:
  postgres:
    # 실행할 PostgreSQL의 버전을 지정합니다.
    image: postgres:17.11-bookworm
    # 비어 있는 DB 저장 공간을 처음 만들 때 쓸 DB 이름·사용자·비밀번호입니다.
    # .env의 POSTGRES_PASSWORD를 가져옵니다. :?는 값이 없거나 비면 시작을 거부하라는 뜻입니다.
    # 이미 만들어진 DB의 비밀번호가 .env 수정만으로 바뀌지는 않습니다.
    environment:
      POSTGRES_DB: finaccess
      POSTGRES_USER: finaccess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # 왼쪽 15432는 내 컴퓨터의 접속 번호, 오른쪽 5432는 컨테이너 안 DB의 접속 번호입니다.
    # 127.0.0.1은 이 컴퓨터에서 접속하는 주소입니다. :-15432는 값이 없거나 비면 쓸 기본값입니다.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    # DB 내용을 컨테이너 밖의 이름 있는 저장 공간에 둡니다. 컨테이너를 다시 만들어도 데이터를 보관합니다.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # DB가 연결을 받을 준비가 됐는지 반복 확인합니다. 로그인·업무 쿼리 전체의 성공 검사는 아닙니다.
    # 5초마다 확인, 한 번에 3초 제한, 실패 10회 기준이며 시작 직후 10초는 준비 시간을 줍니다.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finaccess -d finaccess"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
