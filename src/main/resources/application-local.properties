# [이 파일이 하는 일] 내 컴퓨터에서 실행할 때만 쓸 설정을 추가합니다.
# --spring.profiles.active=local 옵션으로 local 설정 묶음(프로필)을 선택합니다.
# 공통 application.properties 위에 여기 적힌 값을 적용합니다.
# 저장소의 맨 위 폴더에서 실행하세요. .env 파일 위치는 실행한 폴더를 기준으로 찾습니다.
# 실제 비밀번호가 들어 있는 .env는 Git에 올리지 않습니다.

# .env를 읽습니다. [.properties]는 확장자가 없어도 key=value 형식으로 읽으라는 표시입니다.
# Docker Compose가 읽는 것과 별개로 Spring에게도 읽도록 알려 주는 설정입니다.
spring.config.import=file:./.env[.properties]
# 내 컴퓨터에서 실행하는 앱이 DB에 접속할 주소입니다. 포트 설정이 없으면 15432를 사용합니다.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/finaccess
# .env에서 읽은 비밀번호로 DB에 접속합니다.
spring.datasource.password=${POSTGRES_PASSWORD}
