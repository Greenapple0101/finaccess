# local 프로필에서만 적용됩니다. --spring.profiles.active=local 옵션으로 활성화합니다.
# .env를 properties 형식으로 명시적으로 읽습니다. Compose가 읽는 것과 별개의 설정입니다.
# Only the local profile reads the ignored Compose environment file.
spring.config.import=file:./.env[.properties]
# POSTGRES_PORT가 없으면 15432를 사용합니다. 이 URL은 호스트에서 실행하는 앱 기준입니다.
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/finaccess
# 위에서 읽은 .env의 POSTGRES_PASSWORD를 DB 접속 비밀번호로 사용합니다.
spring.datasource.password=${POSTGRES_PASSWORD}
