spring.application.name=finaccess

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/finaccess}
spring.datasource.username=${DB_USERNAME:finaccess}
spring.datasource.password=${DB_PASSWORD}
spring.sql.init.mode=never
spring.flyway.clean-disabled=true

# Flyway owns schema changes; Hibernate only validates the mapping.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
