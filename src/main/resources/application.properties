# [Spring이 읽는 공통 설정: key=value 형식]
# Java 메서드가 아니라 Spring Boot와 라이브러리가 읽어 동작을 결정하는 값입니다.
# URL·사용자·비밀번호를 JDBC 연결 구성에 전달하고, ORM·Flyway 정책을 지정합니다.
# ${DB_URL:기본값}은 DB_URL 설정이 없으면 기본값을 쓰는 자리표시자입니다.
# ${DB_PASSWORD}에는 기본값이 없으므로 올바른 환경 설정이 필요합니다.
# 로컬은 application-local.properties가 추가 적용됩니다. 실행 옵션으로 프로필을 활성화합니다.
# 직접 SQL을 실행하는 Flyway와 객체를 매핑하는 Hibernate는 역할이 다릅니다.
# validate는 모든 DB 제약이나 업무 규칙을 보증하지 않습니다. 그래서 실제 DB 테스트도 둡니다.

# 로그와 Spring 설정에서 사용하는 앱 이름입니다.
spring.application.name=finaccess

# DB 접속 주소. ${환경변수:기본값} 문법으로 환경변수가 없을 때만 기본값을 사용합니다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/finaccess}
# DB 접속 사용자입니다. local 이외에서도 환경변수로 바꿀 수 있습니다.
spring.datasource.username=${DB_USERNAME:finaccess}
# 비밀번호는 외부에서 제공합니다. 저장소에 실제 값을 적지 않습니다.
spring.datasource.password=${DB_PASSWORD}
# schema.sql/data.sql 자동 실행을 끕니다. 구조 변경은 Flyway 하나로 관리합니다.
spring.sql.init.mode=never
# Flyway의 스키마 삭제 기능 clean을 비활성화합니다.
spring.flyway.clean-disabled=true

# Flyway owns schema changes; Hibernate only validates the mapping.
# validate: 테이블을 만들거나 고치지 않고 엔티티와 기존 테이블의 매핑을 검사합니다.
spring.jpa.hibernate.ddl-auto=validate
# HTTP 응답 처리까지 영속성 컨텍스트를 유지하지 않습니다. 필요한 데이터는 Service 안에서 읽습니다.
spring.jpa.open-in-view=false
