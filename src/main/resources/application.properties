# [이 파일이 하는 일] 앱 이름, DB 접속 방법, 저장 도구의 동작을 정합니다.
# 왼쪽은 설정 이름, = 오른쪽은 값입니다. Java 메서드처럼 직접 실행하는 코드는 아닙니다.
# ${이름:기본값}은 외부에서 받은 값을 찾고, 없으면 : 뒤의 값을 사용하라는 뜻입니다.

# 로그에서 앱을 구분할 이름입니다.
spring.application.name=finaccess

# DB에 접속할 주소입니다. DB_URL 설정이 없으면 내 컴퓨터의 15432번 포트를 사용합니다.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/finaccess}
# DB 로그인에 쓸 사용자 이름입니다.
spring.datasource.username=${DB_USERNAME:finaccess}
# 비밀번호는 외부 설정에서 받아 옵니다. 이 파일에 실제 비밀번호를 적지 않습니다.
spring.datasource.password=${DB_PASSWORD}
# 별도의 schema.sql/data.sql 자동 실행을 끕니다. 테이블 변경은 Flyway가 한 곳에서 관리합니다.
spring.sql.init.mode=never
# Flyway의 clean 명령으로 DB 구조를 지우는 기능을 끕니다.
spring.flyway.clean-disabled=true

# Hibernate는 Java 객체와 DB를 연결하는 도구입니다. validate는 두 구조가 맞는지 확인만 합니다.
# 테이블을 만들거나 바꾸는 SQL은 Flyway가 실행합니다. 모든 업무 규칙까지 검사하는 설정은 아닙니다.
spring.jpa.hibernate.ddl-auto=validate
# 응답을 만드는 끝까지 DB 객체 관리 공간을 열어 두지 않습니다. 필요한 값은 Service에서 미리 읽습니다.
# 따라서 응답을 만들다가 아직 읽지 않은 연관 데이터를 뒤늦게 찾으려 하면 오류가 날 수 있습니다.
spring.jpa.open-in-view=false

# 금액 1.5를 1로 잘라 받지 않고 입력 오류로 거부합니다. 원 단위 정수만 받기 위한 설정입니다.
spring.jackson.deserialization.accept-float-as-int=false
